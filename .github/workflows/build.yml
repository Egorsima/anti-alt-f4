name: Build EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Make icon
        run: python make_icon.py

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name anti-alt-f4 --icon icon.ico anti_alt_f4.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-alt-f4-exe
          path: dist/anti-alt-f4.exe
