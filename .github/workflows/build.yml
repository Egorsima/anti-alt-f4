name: Build EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Check deps
        shell: bash
        run: |
          set -e
          python -c "import tkinter; print('tkinter ok')"
          python -c "from pycaw.pycaw import AudioUtilities; print('pycaw ok')"
          python -c "import screamer; print('screamer import ok, lines:', len(screamer.SCREAMER_LINES))"
          python -c "import screamer; p, ev, ln, ta = screamer.get_track(lambda m: None); print('wav:', p, 'events:', len(ev), 'angel_at:', round(ta, 1))"
          python -c "import screamer; fr = screamer.load_frames(lambda m: None); print('frames:', len(fr), fr[0].size if fr else 'FAILED')"
          python -c "import screamer, os; print('sfx files:', len(os.listdir(screamer.resource_path('assets/sfx'))))"

      - name: Smoke test screamer
        shell: bash
        run: python tools/smoketest_screamer.py

      - name: Check font
        shell: bash
        run: python -c "from PIL import ImageFont; f=ImageFont.truetype('arial.ttf', 20); print('font ok:', f)"

      - name: Make icon
        shell: bash
        continue-on-error: true
        run: python make_icon.py

      - name: Build exe
        shell: bash
        run: |
          DATA="assets/frames.bin;assets"
          DATA2="assets/sfx;assets/sfx"
          if [ -f icon.ico ]; then
            pyinstaller --onefile --noconsole --name anti-alt-f4 --icon icon.ico \
              --add-data "$DATA" --add-data "$DATA2" anti_alt_f4.py
          else
            echo "icon.ico not found, building without icon"
            pyinstaller --onefile --noconsole --name anti-alt-f4 \
              --add-data "$DATA" --add-data "$DATA2" anti_alt_f4.py
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-alt-f4-exe
          path: dist/anti-alt-f4.exe

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: anti-alt-f4-exe

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v0.1.0-test"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=$TAG"
          ls -la
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create "$TAG" \
              --title "Anti Alt+F4 $TAG" \
              --notes "Тестовая версия. Запусти anti-alt-f4.exe — приложение повисит в трее. Нажмешь Alt+F4 — комбинация заблокируется и по центру появится окно с репликой (1 → 9). Выход: иконка в трее → Выход."
          fi

      - name: Upload exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v0.1.0-test"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          gh release upload "$TAG" anti-alt-f4.exe --clobber
          gh release view "$TAG"
